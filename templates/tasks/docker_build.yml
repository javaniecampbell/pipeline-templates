# templates/tasks/docker_build.yml
parameters:
  - name: dockerfilePath
    type: string
    default: ""
  - name: repository
    type: string
    default: ""
  - name: containerRegistry
    type: string
    default: ""
  - name: tags
    type: string
    default: ""
  - name: additionalArgs
    type: string
    default: ""

steps:
  - task: Docker@2
    displayName: "Build Docker Image"
    inputs:
      command: build
      dockerfile: ${{ parameters.dockerfilePath }}
      repository: ${{ parameters.repository }}
      containerRegistry: ${{ parameters.containerRegistry }}
      arguments: ${{ parameters.additionalArgs }}
      tags: |
        ${{ parameters.tags }}
