# templates/tasks/helm_deploy.yml
# Generic Helm deployment task.
# Parameters:
#   command: 'upgrade' (or 'install', 'rollback', etc.)
#   releaseName: Name of the Helm release.
#   chartPath: File path to the Helm chart.
#   namespace: Kubernetes namespace.
#   additionalArgs: Additional command line arguments.
parameters:
  - name: command
    type: string
    default: "upgrade"
  - name: releaseName
    type: string
    default: ""
  - name: chartPath
    type: string
    default: ""
  - name: namespace
    type: string
    default: ""
  - name: additionalArgs
    type: string
    default: ""

steps:
  - task: HelmDeploy@1
    displayName: "Helm Deploy: ${{ parameters.command }}"
    inputs:
      connectionType: "Azure Resource Manager"
      azureSubscription: "$(AzureSubscriptionForHelm)" # Set via variable group or pipeline variable
      azureResourceGroup: "$(ResourceGroupForHelm)" # Set via variable group or pipeline variable
      kubernetesCluster: "$(KubernetesCluster)" # Set via variable group or pipeline variable
      command: ${{ parameters.command }}
      chartType: "FilePath"
      chartPath: ${{ parameters.chartPath }}
      releaseName: ${{ parameters.releaseName }}
      namespace: ${{ parameters.namespace }}
      arguments: ${{ parameters.additionalArgs }}
