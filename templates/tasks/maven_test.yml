# templates/tasks/maven_test.yml
parameters:
  - name: mavenPomFile
    type: string
    default: ""
  - name: goals
    type: string
    default: ""
  - name: testResultsFiles
    type: string
    default: ""
  - name: javaHomeOption
    type: string
    default: "Path"
  - name: jdkDirectory
    type: string
    default: ""
  - name: mavenVersionOption
    type: string
    default: "Default"
  - name: mavenOptions
    type: string
    default: ""

steps:
  - task: Maven@3
    displayName: "Execute Unit Tests"
    inputs:
      mavenPomFile: ${{ parameters.mavenPomFile }}
      goals: ${{ parameters.goals }}
      publishJUnitResults: true
      testResultsFiles: ${{ parameters.testResultsFiles }}
      javaHomeOption: ${{ parameters.javaHomeOption }}
      jdkDirectory: ${{ parameters.jdkDirectory }}
      mavenVersionOption: ${{ parameters.mavenVersionOption }}
      mavenOptions: ${{ parameters.mavenOptions }}
      mavenAuthenticateFeed: false
      effectivePomSkip: false
      sonarQubeRunAnalysis: false
