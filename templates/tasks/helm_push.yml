# templates/tasks/helm_push.yml
parameters:
  - name: destinationRegistry
    type: string
    default: ""

steps:
  - task: Bash@3
    inputs:
      targetType: "inline"
      script: "helm push '$(Build.ArtifactStagingDirectory)/$(chartName)' oci://${{ parameters.destinationRegistry }}"
    displayName: "Helm Push"
