# templates/tasks/keyvault_pull.yml
parameters:
  - name: azureSubscription
    default: ""
  - name: KeyVaultName
    default: ""
  - name: SecretsFilter
    default: ""

steps:
  - task: AzureKeyVault@2
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      KeyVaultName: ${{ parameters.KeyVaultName }}
      SecretsFilter: ${{ parameters.SecretsFilter }}
      RunAsPreJob: true
    displayName: "Pull Secrets from Key Vault"
