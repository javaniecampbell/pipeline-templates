# templates/tasks/send_telemetry.yml
parameters:
  - name: telemetryEndpoint
    type: string
    default: ""
  - name: buildNumber
    type: string
    default: "$(Build.BuildNumber)"
  - name: buildDuration
    type: string
    default: "" # Custom value: calculate or pass as parameter
  - name: status
    type: string
    default: ""

steps:
  - task: Bash@3
    displayName: "Send Telemetry Data"
    inputs:
      targetType: "inlineScript"
      script: |
        # Example: sending telemetry via a POST request
        curl -X POST ${{ parameters.telemetryEndpoint }} \
             -H "Content-Type: application/json" \
             -d '{
                   "buildNumber": "'${{ parameters.buildNumber }}'",
                   "buildDuration": "'${{ parameters.buildDuration }}'",
                   "status": "'${{ parameters.status }}'"
                 }'
