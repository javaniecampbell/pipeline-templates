# templates/tasks/nextjs_install_task.yml
parameters:
  - name: installCommand
    type: string
    default: "npm install"
steps:
  - task: Bash@3
    displayName: "Install Next.js Dependencies"
    inputs:
      targetType: "inlineScript"
      script: |
        echo "Running dependency install: ${{ parameters.installCommand }}"
        ${{ parameters.installCommand }}
