# templates/tasks/helm_login.yml
parameters:
  - name: registry
    default: ""
  - name: secretVariable
    default: ""
  - name: userVariable
    default: ""

steps:
  - task: Bash@3
    inputs:
      targetType: "inline"
      script: "echo $($(secretVariable)) | helm registry login ${{ parameters.registry }} -u $($(userVariable)) --password-stdin"
    displayName: "Helm Registry Login"
