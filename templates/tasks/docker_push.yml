# templates/tasks/docker_push.yml
parameters:
  - name: repository
    default: ""
  - name: containerRegistry
    default: ""
  - name: tags
    default: ""

steps:
  - task: Docker@2
    displayName: "Push Docker Image"
    inputs:
      command: push
      repository: ${{ parameters.repository }}
      containerRegistry: ${{ parameters.containerRegistry }}
      tags: |
        ${{ parameters.tags }}
