# templates/jobs/functionapp_deploy_job.yml
# This job template runs a deployment script to deploy the Function App.
parameters:
  - name: vmImageName
    type: string
    default: "ubuntu-latest"
  - name: environmentName
    type: string
    default: ""
  - name: deployScriptPath
    type: string
    default: ""
  - name: artifactPath
    type: string
    default: ""
  - name: functionAppName
    type: string
    default: ""
  - name: azureSubscription
    type: string
    default: ""
  - name: resourceGroup
    type: string
    default: ""

jobs:
  - deployment: FunctionAppDeploy
    displayName: "Deploy Function App"
    environment: ${{ parameters.environmentName }}
    pool:
      vmImage: ${{ parameters.vmImageName }}
    strategy:
      runOnce:
        deploy:
          steps:
            - script: |
                echo "Deploying Function App: ${{ parameters.functionAppName }}"
                bash ${{ parameters.deployScriptPath }} ${{ parameters.functionAppName }} ${{ parameters.azureSubscription }} ${{ parameters.resourceGroup }} ${{ parameters.artifactPath }}
              displayName: "Run Function App Deployment Script"
