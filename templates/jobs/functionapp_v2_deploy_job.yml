# templates/jobs/functionapp_deploy_job.yml
parameters:
  - name: vmImageName
    default: 'ubuntu-latest'
  - name: environmentName
    default: ''
  - name: deployScriptPath
    default: ''
  - name: artifactPath
    default: ''
  - name: functionAppName
    default: ''
  - name: azureSubscription
    default: ''
  - name: resourceGroup
    default: ''

jobs:
- deployment: FunctionAppDeploy
  displayName: "Deploy Function App"
  environment: ${{ parameters.environmentName }}
  pool:
    vmImage: ${{ parameters.vmImageName }}
  strategy:
    runOnce:
      deploy:
        steps:
          - script: |
              echo "Deploying Function App: ${{ parameters.functionAppName }}"
              bash ${{ parameters.deployScriptPath }} \
                ${{ parameters.functionAppName }} \
                ${{ parameters.azureSubscription }} \
                ${{ parameters.resourceGroup }} \
                ${{ parameters.artifactPath }}
            displayName: "Run Function App Deployment Script"
