# templates/jobs/nextjs_prod_build_job.yml
parameters:
  - name: vmImageName
    type: string
    default: "ubuntu-latest"
  - name: installCommand
    type: string
    default: "npm install"
  - name: buildCommand
    type: string
    default: "npm run build"
  - name: artifactPath
    type: string
    default: ""
steps:
  - job: NextJsBuild
    displayName: "Build Next.js App"
    pool:
      vmImage: ${{ parameters.vmImageName }}
    steps:
      - template: ../tasks/nextjs_install.yml
        parameters:
          installCommand: ${{ parameters.installCommand }}
      - template: ../tasks/nextjs_build.yml
        parameters:
          buildCommand: ${{ parameters.buildCommand }}
      - template: ../tasks/publish_build_artifacts.yml
        parameters:
          artifactPath: ${{ parameters.artifactPath }}
