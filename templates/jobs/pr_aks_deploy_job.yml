# templates/jobs/pr_aks_deploy_job.yml
# This job template defines a PR-specific deployment job for AKS.
# It executes a deployment script (e.g., deploy_springboot.sh) with a specified action ("deploy" or "cleanup")
# specifically for PR builds.
#
# Parameters:
#   vmImageName: The build agent VM image to use.
#   environmentName: The Azure DevOps environment name (e.g., 'pr-testing').
#   deployScriptPath: The path to the deployment script.
#   deployAction: The action to execute ("deploy" or "cleanup"). Default is "deploy".
#   artifactPath: (Optional) The path to the artifact to be deployed.
#
parameters:
  - name: vmImageName
    default: "ubuntu-latest"
  - name: environmentName
    default: ""
  - name: deployScriptPath
    default: ""
  - name: deployAction
    default: "deploy"
  - name: artifactPath
    default: ""

jobs:
  - deployment: PRDeployJob
    displayName: "Execute PR AKS Deployment - ${{ parameters.deployAction }}"
    environment: ${{ parameters.environmentName }}
    pool:
      vmImage: ${{ parameters.vmImageName }}
    strategy:
      runOnce:
        deploy:
          steps:
            - script: |
                echo "Starting PR AKS deployment action: ${{ parameters.deployAction }}"
                bash ${{ parameters.deployScriptPath }} ${{ parameters.deployAction }}
              displayName: "Run PR AKS Deployment Script"
