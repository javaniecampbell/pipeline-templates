# templates/jobs/functionapp_build_job.yml
parameters:
  - name: vmImageName
    type: string
    default: "ubuntu-latest"
  - name: mavenPomFile
    type: string
    default: ""
  - name: artifactPath
    type: string
    default: ""
  - name: artifactsFeeds
    type: string
    default: "AD_Applications_Feed"
  - name: sonarProjectKey
    type: string
    default: ""
  - name: sonarProjectName
    type: string
    default: ""
  - name: sonarHostUrl
    type: string
    default: "https://sonarcloud.io"
  - name: sonarLogin
    type: string
    default: ""
  - name: telemetryEndpoint
    type: string
    default: ""

jobs:
  - job: FunctionAppBuild
    displayName: "Build, Analyze, and Publish Function App"
    pool:
      vmImage: ${{ parameters.vmImageName }}
    steps:
      - template: templates/tasks/java_tool_installer.yml
        parameters:
          versionSpec: "21"
          jdkArchitectureOption: "x64"
          jdkSourceOption: "PreInstalled"
      - template: templates/tasks/maven_authenticate.yml
        parameters:
          artifactsFeeds: ${{ parameters.artifactsFeeds }}
      - template: templates/tasks/maven_build_functionapp.yml
        parameters:
          mavenPomFile: ${{ parameters.mavenPomFile }}
          goals: "clean package"
          testResultsFiles: "**/surefire-reports/TEST-*.xml"
      - template: templates/tasks/sonarqube_analysis.yml
        parameters:
          sonarProjectKey: ${{ parameters.sonarProjectKey }}
          sonarProjectName: ${{ parameters.sonarProjectName }}
          sonarHostUrl: ${{ parameters.sonarHostUrl }}
          sonarLogin: ${{ parameters.sonarLogin }}
      - template: templates/tasks/publish_build_artifacts.yml
        parameters:
          artifactPath: ${{ parameters.artifactPath }}
      - template: templates/tasks/send_telemetry.yml
        parameters:
          telemetryEndpoint: ${{ parameters.telemetryEndpoint }}
          buildNumber: "$(Build.BuildNumber)"
          buildDuration: "$(Build.BuildTime)" # Custom: Calculate or set appropriately
          status: "Success"
