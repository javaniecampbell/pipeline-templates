# templates/jobs/nextjs_prod_deploy_job.yml
parameters:
  - name: vmImageName
    default: "ubuntu-latest"
  - name: environmentName
    default: ""
  - name: deployScriptPath
    default: ""
  - name: artifactPath
    default: ""
  - name: deploymentName
    default: "" # e.g., the Kubernetes deployment name for Next.js
  - name: azureSubscription
    default: ""
  - name: resourceGroup
    default: ""
jobs:
  - deployment: NextJsDeploy
    displayName: "Deploy Next.js Production App"
    environment: ${{ parameters.environmentName }}
    pool:
      vmImage: ${{ parameters.vmImageName }}
    strategy:
      runOnce:
        deploy:
          steps:
            - script: |
                echo "Deploying Next.js App: ${{ parameters.deploymentName }}"
                bash ${{ parameters.deployScriptPath }} \
                  ${{ parameters.deploymentName }} \
                  ${{ parameters.azureSubscription }} \
                  ${{ parameters.resourceGroup }} \
                  ${{ parameters.artifactPath }}
              displayName: "Run Next.js Deployment Script"
