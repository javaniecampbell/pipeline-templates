# base-functionapp-pipeline.yml
parameters:
  - name: vmImageName
    type: string
    default: "ubuntu-latest"
  - name: mavenPomFile
    type: string
    default: "pom.xml"
  - name: artifactDestination
    type: string
    default: "$(Build.ArtifactStagingDirectory)"
  - name: functionAppName
    type: string
    default: ""
  - name: azureSubscription
    type: string
    default: ""
  - name: resourceGroup
    type: string
    default: ""
  - name: deployScriptPath
    type: string
    default: "scripts/deploy_functionapp.sh"
  - name: deployEnvironment
    type: string
    default: "function-testing"
  # Parameters for static analysis and telemetry:
  - name: sonarProjectKey
    type: string
    default: ""
  - name: sonarProjectName
    type: string
    default: ""
  - name: sonarHostUrl
    type: string
    default: "https://sonarcloud.io"
  - name: sonarLogin
    type: string
    default: ""
  - name: telemetryEndpoint
    type: string
    default: ""

trigger:
  branches:
    include:
      - develop
      - release/*
  tags:
    include:
      - "*"

stages:
  - template: templates/stages/functionapp_v2.5_build_stage.yml
    parameters:
      vmImageName: ${{ parameters.vmImageName }}
      mavenPomFile: ${{ parameters.mavenPomFile }}
      artifactDestination: ${{ parameters.artifactDestination }}
      sonarProjectKey: ${{ parameters.sonarProjectKey }}
      sonarProjectName: ${{ parameters.sonarProjectName }}
      sonarHostUrl: ${{ parameters.sonarHostUrl }}
      sonarLogin: ${{ parameters.sonarLogin }}
      telemetryEndpoint: ${{ parameters.telemetryEndpoint }}

  - template: templates/stages/functionapp_v2.5_deploy_stage.yml
    parameters:
      vmImageName: ${{ parameters.vmImageName }}
      environmentName: ${{ parameters.deployEnvironment }}
      deployScriptPath: ${{ parameters.deployScriptPath }}
      artifactPath: ${{ parameters.artifactDestination }}
      functionAppName: ${{ parameters.functionAppName }}
      azureSubscription: ${{ parameters.azureSubscription }}
      resourceGroup: ${{ parameters.resourceGroup }}
