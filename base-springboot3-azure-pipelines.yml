# base-springboot-pipeline.yml
# Base pipeline template for Java 21 Spring Boot 3 applications.
# This template uses a stage template to compose the full pipeline.
#
# Parameters:
#   vmImageName: Build agent VM image.
#   dockerRegistryServiceConnection: Service connection for the dev/QA Docker registry.
#   prodDockerRegistryServiceConnection: Service connection for the production Docker registry.
#   imageRepository: Docker image repository name.
#   containerRegistry: Production container registry URL.
#   devHelmChartContainerRegistry: Development Helm chart registry.
#   prodHelmChartContainerRegistry: Production Helm chart registry.
#   helmChartPath: Path to the Helm chart.
#   artifactDestination: Destination folder for packaged artifacts.
#   deployScriptPath: (Optional) Path to the deployment script.
#

parameters:
  - name: vmImageName
    type: string
    default: "ubuntu-latest"
  - name: dockerRegistryServiceConnection
    type: string
    default: ""
  - name: prodDockerRegistryServiceConnection
    type: string
    default: ""
  - name: imageRepository
    type: string
    default: ""
  - name: containerRegistry
    type: string
    default: ""
  - name: devHelmChartContainerRegistry
    type: string
    default: ""
  - name: prodHelmChartContainerRegistry
    type: string
    default: ""
  - name: helmChartPath
    type: string
    default: "helm-chart"
  - name: artifactDestination
    type: string
    default: "$(Build.ArtifactStagingDirectory)"
  - name: deployScriptPath
    type: string
    default: "" # Optional: specify a script to run during deployment
  - name: deployEnvironment
    type: string
    default: "development"
    # Options: "development", "pr-testing", "production"
  - name: failIfCoverageEmpty
    type: boolean
    default: false
trigger:
  branches:
    include:
      - develop
      - release/*
  tags:
    include:
      - "*"

stages:
  - template: templates/stages/java_build_stage.yml
    parameters:
      vmImageName: ${{ parameters.vmImageName }}
      dockerRegistryServiceConnection: ${{ parameters.dockerRegistryServiceConnection }}
      prodDockerRegistryServiceConnection: ${{ parameters.prodDockerRegistryServiceConnection }}
      imageRepository: ${{ parameters.imageRepository }}
      containerRegistry: ${{ parameters.containerRegistry }}
      devHelmChartContainerRegistry: ${{ parameters.devHelmChartContainerRegistry }}
      prodHelmChartContainerRegistry: ${{ parameters.prodHelmChartContainerRegistry }}
      helmChartPath: ${{ parameters.helmChartPath }}
      artifactDestination: ${{ parameters.artifactDestination }}
      failIfCoverageEmpty: ${{ parameters.failIfCoverageEmpty }}
      devHelmChartContainerRegistry: ${{ parameters.devHelmChartContainerRegistry }}
      # # Parameters for PR deployment stage:
      deployEnvironment: "pr-testing"
      # deployScriptPath: "scripts/deploy_springboot.sh"
      # deployAction: "deploy"
  
